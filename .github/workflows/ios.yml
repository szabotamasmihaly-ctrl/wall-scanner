name: iOS build

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Build for iPhone (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project WallScanner.xcodeproj \
            -target WallScanner \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee build.log | grep -E "error:|warning: .*(deprecated|will be an error)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Check the Swift sources were compiled
        working-directory: ios
        run: |
          n=$(grep -c "^SwiftCompile normal" build.log || true)
          echo "Swift compile steps: $n"
          grep "^SwiftCompile normal" build.log | sed -E 's/.* ([^ ]+\.swift).*/\1/' | xargs -n1 basename | sort -u || true
          echo "--- Warnings ---"
          grep -E "\.swift:[0-9]+:[0-9]+: warning:" build.log | sed -E 's|.*/ios/||' | sort -u | head -80 || true
          test "$n" -gt 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
