# Backup only: if WallScanner.xcodeproj ever fails to open, install XcodeGen
# (`brew install xcodegen`) and run `xcodegen` in this folder to regenerate it.
name: WallScanner
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  WallScanner:
    type: application
    platform: iOS
    sources: [WallScanner]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.wallscanner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wall Scanner
        INFOPLIST_KEY_NSCameraUsageDescription: The camera and LiDAR are used to scan walls and to show what is inside them.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
