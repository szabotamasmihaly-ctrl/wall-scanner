<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="description" content="Scan walls while they are open. See pipes and cables through the finished wall.">
<title>Wall Scanner</title>
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.29);
  --blue:#007aff; --green:#34c759; --orange:#ff9500; --red:#ff3b30; --yellow:#ffcc00; --indigo:#5856d6; --teal:#30b0c7; --purple:#af52de;
  --nav:rgba(242,242,247,.8);
  --r:12px; --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000; --card:#1c1c1e; --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
  --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --yellow:#ffd60a; --indigo:#5e5ce6; --teal:#40c8e0; --purple:#bf5af2;
  --nav:rgba(18,18,20,.8);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--label);font:17px/1.35 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.page{min-height:100vh;padding-bottom:calc(env(safe-area-inset-bottom) + 32px)}
.content{max-width:640px;margin:0 auto;padding:0 16px}

/* navigation bar */
.nav{position:sticky;top:0;z-index:10;background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  padding:env(safe-area-inset-top) max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));border-bottom:.5px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--sep)}
.navrow{height:44px;display:flex;align-items:center;justify-content:space-between;max-width:656px;margin:0 auto}
.navtitle{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav.scrolled .navtitle{opacity:1}
.navbtn{color:var(--blue);display:flex;align-items:center;gap:2px;height:44px;padding:0 8px;font-size:17px}
.navbtn svg.i{width:24px;height:24px}
.navbtn.round{width:44px;justify-content:center}
.largetitle{font-size:34px;font-weight:700;letter-spacing:.01em;margin:2px 0 10px;line-height:1.15;word-break:break-word}

/* grouped lists */
.sechead{font-size:13px;text-transform:uppercase;color:var(--label2);margin:26px 16px 7px;letter-spacing:0}
.secfoot{font-size:13px;color:var(--label2);margin:7px 16px 0}
.group{background:var(--card);border-radius:var(--r);overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 16px;position:relative;width:100%;text-align:left}
.cell+.cell:before{content:"";position:absolute;top:0;left:var(--inset,16px);right:0;border-top:.5px solid var(--sep)}
button.cell:active{background:var(--fill)}
.cell .grow{flex:1;min-width:0}
.cell .t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .s{display:block;font-size:15px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .v{color:var(--label2)}
.chev{color:var(--label3);width:14px;height:14px;stroke-width:3}
.thumb{width:64px;height:44px;border-radius:8px;object-fit:cover;background:var(--fill);flex:none}
.iconbox{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.iconbox svg.i{width:18px;height:18px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.cell.destructive{color:var(--red);justify-content:center}
.trash{color:var(--red);width:44px;height:44px;display:grid;place-items:center;margin:-10px -12px -10px 0}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:14px;font-weight:600;font-size:17px;transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.98);opacity:.85}
.btn.filled{background:var(--blue);color:#fff}
.btn.tinted{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.btn:disabled{opacity:.4}
.btnrow{display:flex;gap:12px;margin-top:16px}

/* story hero */
.hero{background:var(--card);border-radius:20px;overflow:hidden;margin-top:4px}
.hero .story{aspect-ratio:16/11}
.hero .herotext{padding:14px 16px 16px;display:flex;align-items:center;gap:12px}
.hero h2{font-size:20px;margin:0 0 2px;font-weight:700}
.hero p{margin:0;color:var(--label2);font-size:15px}
.playbtn{width:44px;height:44px;border-radius:50%;background:var(--fill);color:var(--blue);display:grid;place-items:center;flex:none}
.notice{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:var(--r);padding:14px 16px;margin-top:16px;font-size:15px}
.notice b{display:block;font-size:17px;margin-bottom:2px}
.notice .iconbox{background:var(--orange)}
.empty{text-align:center;color:var(--label2);padding:28px 24px;font-size:15px}
.empty b{display:block;color:var(--label);font-size:20px;margin-bottom:6px}

/* story animation */
.story{position:relative;background:linear-gradient(#dfe7ef,#c9d5e0);overflow:hidden}
@media (prefers-color-scheme: dark){.story{background:linear-gradient(#1d2733,#141b24)}}
.story svg{position:absolute;inset:0;width:100%;height:100%}
.caption{position:absolute;left:0;right:0;bottom:0;padding:28px 16px 12px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;transition:opacity .4s}
.caption b{display:block;font-size:17px}
.caption span{font-size:14px;opacity:.9}
.storydots{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:4px}
.storydots i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.45);overflow:hidden;position:relative}
.storydots i b{position:absolute;inset:0;background:#fff;transform-origin:left;transform:scaleX(0)}

/* onboarding (full screen) */
#onboard{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 16px)}
#onboard .story{flex:1;border-radius:0 0 28px 28px}
#onboard .story .caption{display:none}
#onboard .obtext{padding:24px 24px 8px;text-align:center;min-height:132px}
#onboard h1{font-size:28px;font-weight:700;margin:0 0 8px;letter-spacing:.01em}
#onboard p{margin:0;color:var(--label2);font-size:17px}
#onboard .obbtns{padding:8px 24px 0;max-width:480px;width:100%;margin:0 auto}
#onboard .skip{position:absolute;top:calc(env(safe-area-inset-top) + 18px);right:16px;z-index:2;color:#fff;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:16px;padding:6px 14px;font-size:15px;font-weight:600}
#onboard .story .storydots{top:calc(14px);right:90px}

/* wall page */
.wallcard{background:var(--card);border-radius:var(--r);overflow:hidden}
canvas#wall2d{width:100%;display:block;touch-action:none;background:#1b2028}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 0 12px}
.seg button{flex:1;height:30px;border-radius:7px;font-size:13px;font-weight:600}
.seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.tapinfo{padding:12px 16px;font-size:15px;color:var(--label2);border-top:.5px solid var(--sep)}
.tapinfo b{color:var(--label);display:block;font-size:17px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--label2);padding:0 16px 12px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%}

/* sheets & alerts */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.scrim.show .sheet{transform:none}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:0 auto 10px}
.sheethead{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:8px}
.sheethead b{font-size:17px}
.sheethead button{color:var(--blue);font-size:17px;padding:0 4px;height:44px}
.sheet input{width:100%;font:inherit;background:var(--card);color:var(--label);border:0;border-radius:10px;padding:12px 14px;outline:none}
.sheet .tip{display:flex;gap:12px;align-items:flex-start;margin:16px 4px;color:var(--label2);font-size:15px}
.scrim.alert{align-items:center}
.alertbox{background:var(--card);width:270px;border-radius:14px;text-align:center;overflow:hidden;transform:scale(1.1);transition:transform .25s}
.scrim.show .alertbox{transform:none}
.alertbox .ab{padding:19px 16px 15px}
.alertbox b{display:block;font-size:17px;margin-bottom:4px}
.alertbox p{margin:0;font-size:13px}
.alertbox .abtns{display:flex;border-top:.5px solid var(--sep)}
.alertbox .abtns button{flex:1;height:44px;color:var(--blue);font-size:17px}
.alertbox .abtns button+button{border-left:.5px solid var(--sep)}
.alertbox .abtns button.bold{font-weight:600}
.alertbox .abtns button.red{color:var(--red)}

/* AR overlay */
#ar{position:fixed;inset:0;display:none;color:#fff;user-select:none;-webkit-user-select:none;font-family:var(--font)}
#ar.on{display:block}
.glass{background:rgba(30,30,30,.55);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%)}
#arTop{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;gap:10px;align-items:flex-start}
.circ{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.circ svg.i{width:20px;height:20px}
#arCard{flex:1;border-radius:16px;padding:10px 14px;min-height:40px}
#arStep{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.7}
#arMsg{font-size:16px;font-weight:600;line-height:1.3}
#reticle{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;pointer-events:none;--rc:#fff}
#reticle:before{content:"";position:absolute;inset:0;border-radius:50%;border:2.5px solid var(--rc);box-shadow:0 0 0 1px rgba(0,0,0,.25),inset 0 0 0 1px rgba(0,0,0,.25);transition:border-color .2s}
#reticle:after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--rc);box-shadow:0 0 0 1px rgba(0,0,0,.3)}
#readout{position:absolute;left:50%;top:calc(50% + 42px);transform:translateX(-50%);border-radius:14px;padding:8px 14px;font-size:15px;font-weight:600;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.35}
#readout:empty{display:none}
#readout small{font-weight:500;opacity:.8;font-size:13px}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 96px);transform:translate(-50%,-8px);border-radius:20px;padding:8px 16px;font-size:15px;font-weight:600;pointer-events:none;transition:opacity .25s,transform .25s;opacity:0;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#arBot{position:absolute;left:0;right:0;bottom:0;padding:0 0 calc(env(safe-area-inset-bottom) + 18px);background:linear-gradient(transparent,rgba(0,0,0,.45))}
#modes{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;padding:10px 50% 14px;scroll-snap-type:x mandatory;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
#modes::-webkit-scrollbar{display:none}
#modes button{flex:none;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.85);scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:5px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
#modes button i{width:6px;height:6px;border-radius:50%;opacity:.0}
#modes button.sel{color:var(--yellow)}
#modes button.sel i{opacity:1}
#controls{display:flex;align-items:center;justify-content:space-around;padding:0 24px;height:84px}
#controls .side{width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:rgba(255,255,255,.9)}
#controls .side .circ{width:48px;height:48px}
#shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center;transition:transform .1s}
#shutter:active{transform:scale(.92)}
#shutter b{width:60px;height:60px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#000}
#shutter b svg.i{width:28px;height:28px;stroke-width:2.5}
#shutter:disabled{opacity:.4}
#shutter.rec b{background:var(--red);color:#fff;border-radius:12px;width:32px;height:32px}
.recdot{width:18px;height:18px;border-radius:50%;background:var(--red)}
.side.on .circ{background:var(--red)}
.side.on .recdot{background:#fff;border-radius:4px;width:14px;height:14px}
#pills{display:flex;justify-content:center;gap:8px;padding:0 16px 6px;flex-wrap:wrap}
.pill{height:36px;border-radius:18px;padding:0 16px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;color:#fff}
.pill.y{background:var(--yellow);color:#000}
.pill input[type=range]{width:120px;accent-color:#fff}
#nudge{display:flex;justify-content:center;gap:8px;padding:0 16px 8px}
#nudge .circ{width:44px;height:44px}
</style>
</head>
<body>

<!-- Home -->
<div class="page" id="home">
  <div class="nav" id="homeNav"><div class="navrow"><span></span><span class="navtitle">Walls</span>
    <button class="navbtn round" id="newWallTop" aria-label="New wall"><svg class="i"><use href="#i-plus"/></svg></button></div></div>
  <div class="content">
    <h1 class="largetitle">Walls</h1>
    <div class="hero">
      <div class="story" id="heroStory"></div>
      <div class="herotext"><div style="flex:1"><h2>How it works</h2><p>Watch the short intro</p></div>
        <button class="playbtn" id="replayIntro" aria-label="Watch how it works"><svg class="i"><use href="#i-expand"/></svg></button></div>
    </div>
    <div id="support"></div>
    <div class="sechead" id="wallsHead">My walls</div>
    <div id="wallList"></div>
    <div class="btnrow"><button class="btn filled" id="newWallBtn"><svg class="i"><use href="#i-plus"/></svg>New Wall</button></div>
    <div class="btnrow" style="margin-top:10px"><button class="btn tinted" id="importBtn">Import a Wall File</button></div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</div>

<!-- Wall page -->
<div class="page" id="wallView" hidden>
  <div class="nav" id="wallNav"><div class="navrow">
    <button class="navbtn" id="backBtn"><svg class="i" style="width:26px;height:26px"><use href="#i-back"/></svg>Walls</button>
    <span class="navtitle" id="wallNavTitle"></span>
    <button class="navbtn round" id="exportBtn" aria-label="Share"><svg class="i"><use href="#i-share"/></svg></button></div></div>
  <div class="content">
    <h1 class="largetitle" id="wallTitle"></h1>
    <div class="seg" id="seg"><button data-v="both" class="on">Photo + Marks</button><button data-v="marks">Marks</button><button data-v="photo">Photo</button></div>
    <div class="wallcard">
      <canvas id="wall2d"></canvas>
      <div class="legend" id="legend" style="padding-top:12px"></div>
      <div class="tapinfo" id="info2d">Tap anywhere on the wall to see what’s nearby.</div>
    </div>
    <div class="btnrow">
      <button class="btn filled" id="checkBtn"><svg class="i"><use href="#i-scope"/></svg>Check Wall</button>
      <button class="btn tinted" id="scanMoreBtn"><svg class="i"><use href="#i-pen"/></svg>Add Marks</button>
    </div>
    <div class="secfoot" id="xrHint" hidden>The camera features need an Android phone with Chrome.</div>
    <div class="sechead">Marks</div>
    <div class="group" id="flist"></div>
    <div class="sechead">Details</div>
    <div class="group" id="details"></div>
    <div class="group" style="margin-top:26px"><button class="cell destructive" id="renameBtn" style="color:var(--blue)">Rename Wall</button><button class="cell destructive" id="deleteBtn">Delete Wall</button></div>
  </div>
</div>

<!-- Onboarding -->
<div id="onboard" hidden>
  <button class="skip" id="obSkip">Skip</button>
  <div class="story" id="obStory"></div>
  <div class="obtext"><h1 id="obTitle"></h1><p id="obText"></p></div>
  <div class="obbtns"><button class="btn filled" id="obGo">Get Started</button></div>
</div>

<!-- AR overlay (shown on top of the live camera) -->
<div id="ar">
  <div id="arTop">
    <button class="circ glass" id="arExit" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button>
    <div id="arCard" class="glass"><div id="arStep"></div><div id="arMsg"></div></div>
  </div>
  <div id="reticle"></div>
  <div id="readout" class="glass"></div>
  <div id="toast" class="glass"></div>
  <div id="arBot">
    <div id="nudge" hidden>
      <button class="circ glass" data-n="-1,0" aria-label="Left"><svg class="i"><use href="#i-left"/></svg></button>
      <button class="circ glass" data-n="0,1" aria-label="Up"><svg class="i"><use href="#i-up"/></svg></button>
      <button class="circ glass" data-n="0,-1" aria-label="Down"><svg class="i" style="transform:rotate(180deg)"><use href="#i-up"/></svg></button>
      <button class="circ glass" data-n="1,0" aria-label="Right"><svg class="i" style="transform:rotate(180deg)"><use href="#i-left"/></svg></button>
      <button class="pill glass" data-n="0,0">Reset</button>
    </div>
    <div id="pills"></div>
    <div id="modes"></div>
    <div id="controls">
      <div class="side" id="leftCtl"></div>
      <button id="shutter" aria-label="Add"><b></b></button>
      <div class="side" id="rightCtl"></div>
    </div>
  </div>
</div>

<!-- icons -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4M6 11H5v10h14V11h-1"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-scope" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="1" fill="currentColor"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></symbol>
  <symbol id="i-adjust" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></symbol>
  <symbol id="i-corner" viewBox="0 0 24 24"><path d="M5 3v16h16"/><circle cx="5" cy="19" r="2.2" fill="currentColor"/></symbol>
</svg>

<script>
"use strict";
const $ = id => document.getElementById(id);

/* ---------- mark types ---------- */
const TYPES = {
  pipe:   {label:'Pipe',        color:'#0a84ff', w:0.04,  kind:'line',  danger:true},
  cable:  {label:'Cable',       color:'#ff9f0a', w:0.02,  kind:'line',  danger:true},
  rebar:  {label:'Rebar',       color:'#ff453a', w:0.016, kind:'line',  danger:true},
  box:    {label:'Socket',  color:'#bf5af2', w:0.08,  kind:'point', danger:true},
  hole:   {label:'Hole',        color:'#30d158', w:0.06,  kind:'point', danger:true},
  opening:{label:'Window', color:'#ffffff', w:0,     kind:'rect',  danger:false},
  measure:{label:'Measure',     color:'#ffffff', w:0,     kind:'two',   danger:false},
};
const MARGIN = 0.05;      // keep 5 cm from anything dangerous
const DEFAULT_H = 2.6;

/* ---------- geometry on the wall (u = metres from corner 1 along the wall, v = metres up) ---------- */
function segDist(p,a,b){
  const dx=b[0]-a[0], dy=b[1]-a[1], L=dx*dx+dy*dy;
  let t = L ? ((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L : 0; t=Math.max(0,Math.min(1,t));
  return Math.hypot(p[0]-a[0]-t*dx, p[1]-a[1]-t*dy);
}
function featDist(f,p){
  const t=TYPES[f.type];
  if(t.kind==='point') return Math.max(0, Math.hypot(p[0]-f.pts[0][0], p[1]-f.pts[0][1]) - t.w/2);
  if(t.kind==='line'){ let d=Infinity; for(let i=1;i<f.pts.length;i++) d=Math.min(d,segDist(p,f.pts[i-1],f.pts[i])); return Math.max(0,d-t.w/2); }
  if(t.kind==='rect'){ const [a,b]=f.pts, x0=Math.min(a[0],b[0]),x1=Math.max(a[0],b[0]),y0=Math.min(a[1],b[1]),y1=Math.max(a[1],b[1]);
    const dx=Math.max(x0-p[0],0,p[0]-x1), dy=Math.max(y0-p[1],0,p[1]-y1); return Math.hypot(dx,dy); }
  return Infinity;
}
function nearestDanger(wall,p){
  let best=null, d=Infinity;
  for(const f of wall.features){ if(!TYPES[f.type].danger) continue; const x=featDist(f,p); if(x<d){d=x;best=f;} }
  return {f:best,d};
}
function blockedDist(wall,p){
  let d=Infinity;
  for(const f of wall.features){ const t=TYPES[f.type]; if(t.danger||t.kind==='rect') d=Math.min(d,featDist(f,p)); }
  return d;
}
function freeSpace(wall,p){
  const step=0.01, out={};
  for(const [k,dx,dy] of [['l',-1,0],['r',1,0],['d',0,-1],['u',0,1]]){
    let s=0;
    while(s<8){
      const q=[p[0]+dx*(s+step), p[1]+dy*(s+step)];
      if(q[0]<0||q[0]>wall.W||q[1]<0||q[1]>wall.H) break;
      if(blockedDist(wall,q)<MARGIN) break;
      s+=step;
    }
    out[k]=s;
  }
  return {w:out.l+out.r, h:out.u+out.d};
}
const cm = m => (m*100).toFixed(0)+' cm';
const mm2 = m => m>=1 ? m.toFixed(2)+' m' : cm(m);

/* ---------- drawing a wall in 2D (shared by the AR overlay texture and the wall page) ---------- */
function drawWall(ctx, wall, s, opts={}){
  const X=u=>u*s, Y=v=>(wall.H-v)*s;
  const fs=Math.max(11, 0.05*s);
  ctx.lineCap='round'; ctx.lineJoin='round';
  if(opts.grid){
    ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=Math.max(1,s*0.003);
    ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.font=`${fs*0.8}px system-ui`;
    for(let u=0.5;u<wall.W;u+=0.5){ctx.beginPath();ctx.moveTo(X(u),0);ctx.lineTo(X(u),Y(0));ctx.stroke(); ctx.fillText(u.toFixed(1),X(u)+3,Y(0)-4);}
    for(let v=0.5;v<wall.H;v+=0.5){ctx.beginPath();ctx.moveTo(0,Y(v));ctx.lineTo(X(wall.W),Y(v));ctx.stroke(); ctx.fillText(v.toFixed(1),3,Y(v)-3);}
    ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=Math.max(2,s*0.006); ctx.strokeRect(0,0,X(wall.W),Y(0));
  }
  const list = opts.pending && opts.pending.pts.length ? [...wall.features, {...opts.pending, pending:true}] : wall.features;
  // halos first
  for(const f of list){ const t=TYPES[f.type]; if(!t.danger) continue;
    ctx.strokeStyle=t.color+'40'; ctx.fillStyle=t.color+'40'; ctx.lineWidth=(t.w+2*MARGIN)*s;
    if(t.kind==='line' && f.pts.length>1){ctx.beginPath();f.pts.forEach((p,i)=>i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));ctx.stroke();}
    if(t.kind==='point'){ctx.beginPath();ctx.arc(X(f.pts[0][0]),Y(f.pts[0][1]),(t.w/2+MARGIN)*s,0,7);ctx.fill();}
  }
  for(const f of list){
    const t=TYPES[f.type]; ctx.strokeStyle=t.color; ctx.fillStyle=t.color;
    const P=f.pts.map(p=>[X(p[0]),Y(p[1])]);
    if(t.kind==='line'){
      ctx.lineWidth=Math.max(3,t.w*s);
      if(P.length>1){ctx.beginPath();P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();}
      P.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],Math.max(3,t.w*s*0.6),0,7);ctx.fill();});
    } else if(t.kind==='point'){
      const r=t.w/2*s;
      if(f.type==='box'){ctx.lineWidth=Math.max(2,s*0.008);ctx.strokeRect(P[0][0]-r,P[0][1]-r,2*r,2*r);ctx.fillStyle=t.color+'66';ctx.fillRect(P[0][0]-r,P[0][1]-r,2*r,2*r);}
      else {ctx.beginPath();ctx.arc(P[0][0],P[0][1],r,0,7);ctx.fillStyle=t.color+'99';ctx.fill();ctx.lineWidth=Math.max(2,s*0.006);ctx.stroke();}
    } else if(t.kind==='rect'||t.kind==='two'){
      ctx.lineWidth=Math.max(2,s*0.006);
      if(t.kind==='two') ctx.setLineDash([s*0.03,s*0.02]);
      if(P.length===1){ctx.beginPath();ctx.arc(P[0][0],P[0][1],Math.max(4,s*0.01),0,7);ctx.fill();}
      else if(t.kind==='rect'){
        ctx.strokeRect(Math.min(P[0][0],P[1][0]),Math.min(P[0][1],P[1][1]),Math.abs(P[1][0]-P[0][0]),Math.abs(P[1][1]-P[0][1]));
        const a=f.pts[0],b=f.pts[1]; const x0=Math.min(a[0],b[0]),y0=Math.min(a[1],b[1]);
        label(ctx,`${cm(Math.abs(b[0]-a[0]))} × ${cm(Math.abs(b[1]-a[1]))}`,X(x0)+4,Y(Math.max(a[1],b[1]))+fs+2,fs);
        label(ctx,`← ${mm2(x0)}  ↑ ${mm2(y0)}`,X(x0)+4,Y(y0)-6,fs*0.85);
      } else {
        ctx.beginPath();ctx.moveTo(P[0][0],P[0][1]);ctx.lineTo(P[1][0],P[1][1]);ctx.stroke();
        const L=Math.hypot(f.pts[1][0]-f.pts[0][0],f.pts[1][1]-f.pts[0][1]);
        label(ctx,mm2(L),(P[0][0]+P[1][0])/2+4,(P[0][1]+P[1][1])/2-6,fs);
      }
      ctx.setLineDash([]);
    }
  }
  if(opts.cursor){
    const p=opts.cursor; ctx.strokeStyle='#fff'; ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(X(p[0])-12,Y(p[1]));ctx.lineTo(X(p[0])+12,Y(p[1]));ctx.moveTo(X(p[0]),Y(p[1])-12);ctx.lineTo(X(p[0]),Y(p[1])+12);ctx.stroke();
  }
}
function label(ctx,text,x,y,fs){
  ctx.font=`600 ${fs}px system-ui`; const w=ctx.measureText(text).width;
  ctx.save(); ctx.setLineDash([]); ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(x-3,y-fs,w+6,fs*1.3); ctx.fillStyle='#fff'; ctx.fillText(text,x,y); ctx.restore();
}
function describe(wall,p){
  const n=nearestDanger(wall,p), fsp=freeSpace(wall,p);
  let status, level;
  if(!n.f){status='No marked pipes or cables'; level='ok';}
  else if(n.d<MARGIN){status=`Too close: ${TYPES[n.f.type].label.toLowerCase()} ${cm(n.d)}`; level='bad';}
  else if(n.d<0.15){status=`Careful: ${TYPES[n.f.type].label.toLowerCase()} ${cm(n.d)}`; level='warn';}
  else {status=`OK to drill · nearest ${TYPES[n.f.type].label.toLowerCase()} ${cm(n.d)}`; level='ok';}
  return {status, level, free:`Free space ${mm2(fsp.w)} wide × ${mm2(fsp.h)} high`, pos:`${mm2(p[0])} from corner 1 · ${mm2(p[1])} up`};
}

let dbP=null;
function db(){ if(!dbP) dbP=new Promise((res,rej)=>{const r=indexedDB.open('wallscanner-live',1);r.onupgradeneeded=()=>r.result.createObjectStore('walls',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}); return dbP; }
async function tx(mode,fn){ const d=await db(); return new Promise((res,rej)=>{const t=d.transaction('walls',mode);const s=t.objectStore('walls');const r=fn(s);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);}); }
const putWall=w=>tx('readwrite',s=>s.put(w));
const getWall=id=>tx('readonly',s=>s.get(id));
const allWalls=()=>tx('readonly',s=>s.getAll());
const delWall=id=>tx('readwrite',s=>s.delete(id));

/* ---------- story animation: explains the idea in four short scenes ---------- */
const SCENES = [
  {t:0,    title:'Scan the wall while it’s open', text:'During construction, film the wall with your phone while pipes, cables and rebar are still visible.'},

const STORY_LEN = 17.2;
const clamp01 = x => Math.max(0, Math.min(1, x));
const ease = x => { x=clamp01(x); return x*x*(3-2*x); };
const lerp = (a,b,t) => a+(b-a)*t;

function createStory(el, opts={}){
  const id = 's'+Math.random().toString(36).slice(2,7);

    </g>
    <g clip-path="url(#${id}c)" id="${id}xray" opacity="0">
      <rect x="0" y="0" width="360" height="248" fill="#0b1a2a" opacity=".22"/>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M30 100H330M30 176H330" stroke="#ff453a" stroke-width="2.5" opacity=".9"/>
        <path d="M100 228V70H214" stroke="#0a84ff" stroke-width="8" opacity=".55"/>
        <path d="M100 228V70H214" stroke="#0a84ff" stroke-width="3.5"/>
        <path d="M262 228V136" stroke="#ff9f0a" stroke-width="4.5"/>
        <rect x="250" y="112" width="24" height="24" rx="3" fill="#bf5af2" opacity=".8"/>

      </g>

  <div class="storydots">${SCENES.map(()=>'<i><b></b></i>').join('')}</div>
  <div class="caption"><b></b><span></span></div>`;
  const q = s => el.querySelector('#'+id+s);
  const guts = q('guts').children, phone=q('phone'), scan=q('scan'), plaster=q('plaster'), xray=q('xray'), cr=q('cr'),

    raf=requestAnimationFrame(frame);

    // pipes draw themselves in
    const g=ease((t-0.3)/1.4);
    for(let i=0;i<3;i++) guts[i].setAttribute('stroke-dashoffset', 1-ease(g*1.2-i*0.1));
    guts[3].setAttribute('opacity', ease((t-1.2)/0.4));

    else {
      po=ease((t-10.2)/0.4);
      if(t<11.8) px=lerp(255,104,ease((t-10.4)/1.4));
      else if(t<13.2) px=104;
      else if(t<14.4) px=lerp(104,175,ease((t-13.2)/1.2));
      else if(t<15.2) px=175;
      else px=lerp(175,290,ease((t-15.2)/0.7));
    }

    // scanned area
    const scanned = t<4.6 ? Math.max(0,Math.min(300,(px-30+46)*ease((t-1.8)/0.2))) : t<7.6 ? 300 : 0;
    scan.setAttribute('width',scanned); scan.setAttribute('opacity', t<7.6 ? 0.16*(1-ease((t-7.0)/0.6)) : 0);
    sline.setAttribute('opacity', t>1.8&&t<4.4 ? 1 : 0); sline.setAttribute('y', -2+Math.sin(t*6)*60);
    // saved badge
    const sv = t>5.5&&t<7.4 ? ease((t-5.5)/0.3) : 0; saved.setAttribute('opacity',sv); saved.setAttribute('transform',`scale(${0.6+0.4*sv})`);
    // plaster covers everything
    const pl = t<7.6 ? 0 : ease((t-7.9)/1.6); plaster.setAttribute('height',204*pl);
    // x-ray view through the phone
    const xr = t>=10.2 ? po : 0; xray.setAttribute('opacity',xr);
    cr.setAttribute('x',px-42); cr.setAttribute('y',py-78); cr.setAttribute('width',84); cr.setAttribute('height',156);
    ret.setAttribute('opacity', xr);
    const d=Math.abs(px-100), col = d<22 ? '#ff3b30' : d<45 ? '#ff9500' : '#34c759';
    retc.setAttribute('stroke',col); retd.setAttribute('fill',col); tagbg.setAttribute('fill',col);
    tagt.textContent = d<22 ? 'Pipe · too close' : d<45 ? 'Careful' : 'Safe to drill';
    pic.setAttribute('opacity', t>15.5 ? ease((t-15.5)/0.5) : 0);
  }
  return {
    start(){ if(!raf){ raf=requestAnimationFrame(frame);} },
    stop(){ cancelAnimationFrame(raf); raf=0; },
    restart(){ t0=performance.now(); lastScene=-1; this.start(); }
  };
}

function textSheet({title, value='', placeholder='', action='Done', tip=''}){

    inp.onkeydown=e=>{ if(e.key==='Enter') close(inp.value.trim()); };
    document.body.appendChild(s); requestAnimationFrame(()=>{s.classList.add('show'); setTimeout(()=>inp.focus(),350);});
  });
}

const thumbURLs=[];

async function renderHome(){
  show('home'); current=null;
  if(!heroStory){ heroStory=createStory($('heroStory')); }
  heroStory.start();
  thumbURLs.splice(0).forEach(u=>URL.revokeObjectURL(u));
  const walls=(await allWalls()).sort((a,b)=>b.updated-a.updated);
  const L=$('wallList'); L.innerHTML='';
  $('wallsHead').hidden=!walls.length;
  if(!walls.length){
    L.innerHTML='<div class="empty"><b>No walls yet</b>Tap New Wall and point your phone at a wall that’s still open.</div>';
    return;
  }
  const g=document.createElement('div'); g.className='group'; g.style.setProperty('--inset','92px');
  for(const w of walls){
    const d=document.createElement('button'); d.className='cell';
    let img='<div class="thumb"></div>';
    if(w.mosaic){const u=URL.createObjectURL(w.mosaic);thumbURLs.push(u);img=`<img class="thumb" src="${u}" alt="">`;}
    d.innerHTML=`${img}<span class="grow"><span class="t"></span><span class="s">${w.W.toFixed(2)} × ${w.H.toFixed(2)} m · ${w.features.length} mark${w.features.length===1?'':'s'}</span></span>${chevron}`;

let wallImg=null, cursor2d=null, layerMode='both';
async function openWall(id){
  current=await getWall(id); if(!current) return renderHome();
  heroStory&&heroStory.stop();
  show('wall'); cursor2d=null;
  $('wallTitle').textContent=current.name; $('wallNavTitle').textContent=current.name;
  $('info2d').innerHTML='Tap anywhere on the wall to see what’s nearby.';
  wallImg=null;
  if(current.mosaic){ const img=new Image(); img.onload=()=>{wallImg=img;draw2d();}; img.src=URL.createObjectURL(current.mosaic); }
  $('checkBtn').disabled=$('scanMoreBtn').disabled=!xrOK; $('xrHint').hidden=xrOK;
  $('seg').hidden=!current.mosaic;
  $('legend').innerHTML=Object.values(TYPES).filter(t=>t.kind!=='two').map(t=>`<span><i style="background:${t.color}"></i>${t.label}</span>`).join('');
  const rows=[['Width',current.W.toFixed(2)+' m'],['Height',current.H.toFixed(2)+' m'],['Camera picture',current.mosaic?Math.round((current.coverage||0)*100)+'% of wall':'Not filmed yet'],['Last saved',new Date(current.updated).toLocaleString([], {dateStyle:'medium',timeStyle:'short'})]];
  $('details').innerHTML=rows.map(r=>`<div class="cell"><span class="grow">${r[0]}</span><span class="v">${r[1]}</span></div>`).join('');
  renderFList(); draw2d();
}
function draw2d(){
  if(!current) return;
  const c=$('wall2d'), cw=c.clientWidth||340, dpr=Math.min(3,devicePixelRatio||1);
  const s=cw/current.W; c.width=cw*dpr; c.height=current.H*s*dpr; c.style.height=current.H*s+'px';
  const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,cw,current.H*s);
  if(wallImg && layerMode!=='marks') ctx.drawImage(wallImg,0,0,cw,current.H*s);
  if(layerMode!=='photo') drawWall(ctx,current,s,{grid:true,cursor:cursor2d});
  else drawWall(ctx,{...current,features:[]},s,{grid:false,cursor:cursor2d});
}
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b)); layerMode=b.dataset.v; draw2d(); });
function renderFList(){
  const L=$('flist'); L.innerHTML=''; L.style.setProperty('--inset','40px');
  if(!current.features.length){L.innerHTML='<div class="cell" style="color:var(--label2)">No marks yet. Tap Add Marks to start.</div>';return;}
  current.features.forEach((f,i)=>{
    const t=TYPES[f.type], a=f.pts[0];
    let sub=`${mm2(a[0])} from left · ${mm2(a[1])} up`;
    if(t.kind==='two'&&f.pts[1]) sub=`${mm2(Math.hypot(f.pts[1][0]-a[0],f.pts[1][1]-a[1]))} long`;
    if(t.kind==='rect'&&f.pts[1]) sub=`${cm(Math.abs(f.pts[1][0]-a[0]))} × ${cm(Math.abs(f.pts[1][1]-a[1]))} · ${mm2(Math.min(a[0],f.pts[1][0]))} from left`;
    const d=document.createElement('div'); d.className='cell';
    d.innerHTML=`<span class="dot" style="background:${t.color};${t.color==='#ffffff'?'box-shadow:inset 0 0 0 1.5px var(--label3)':''}"></span><span class="grow"><span class="t">${t.label}</span><span class="s">${sub}</span></span><button class="trash" aria-label="Delete"><svg class="i"><use href="#i-trash"/></svg></button>`;
    d.querySelector('button').onclick=async()=>{
      if(!await alertBox(`Delete this ${t.label.toLowerCase()}?`,'',[{label:'Cancel',value:false},{label:'Delete',value:true,red:true,bold:true}])) return;
      current.features.splice(i,1);current.updated=Date.now();await putWall(current);renderFList();draw2d();};
    L.appendChild(d);
  });
}

/* ---------- small vector / matrix helpers (column-major like WebXR) ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const scl=(a,s)=>[a[0]*s,a[1]*s,a[2]*s], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const len=a=>Math.hypot(a[0],a[1],a[2]), norm=a=>scl(a,1/(len(a)||1));
function mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;}
function basis(c0,c1,c2,t){return new Float32Array([c0[0],c0[1],c0[2],0,c1[0],c1[1],c1[2],0,c2[0],c2[1],c2[2],0,t[0],t[1],t[2],1]);}
const mpos=m=>[m[12],m[13],m[14]];

/* ---------- WebGL ---------- */
const VS_TEX=`#version 300 es
in vec2 aP; uniform mat4 uVP,uM; out vec2 vUV;
void main(){vUV=aP;gl_Position=uVP*uM*vec4(aP,0.,1.);}`;
const FS_TEX=`#version 300 es
precision mediump float; in vec2 vUV; uniform sampler2D uT; uniform float uO; uniform int uPre; uniform vec4 uTint; out vec4 o;
void main(){vec4 c=texture(uT,vUV);
 if(uPre==1){ if(c.a<0.03) discard; o=vec4(c.rgb/c.a,uO); }
 else o=vec4(c.rgb*uTint.rgb,c.a*uO*uTint.a);}`;
const VS_ACC=`#version 300 es
in vec2 aP; out vec2 vUV; void main(){vUV=aP;gl_Position=vec4(aP*2.-1.,0.,1.);}`;
const FS_ACC=`#version 300 es
precision highp float; in vec2 vUV;
uniform mat4 uCamVP; uniform vec3 uA,uU,uV,uN,uCam; uniform float uW,uH,uGain,uFlip; uniform sampler2D uImg; out vec4 o;
void main(){
 vec3 w=uA+uU*(vUV.x*uW)+uV*(vUV.y*uH);
 vec4 c=uCamVP*vec4(w,1.); if(c.w<=0.) discard;
 vec2 n=c.xy/c.w; float e=max(abs(n.x),abs(n.y)); if(e>0.98) discard;
 vec2 uv=n*.5+.5; if(uFlip>.5) uv.y=1.-uv.y;
 vec3 toCam=uCam-w; float d=length(toCam); if(d>4.5||d<0.2) discard;
 float facing=abs(dot(toCam/d,uN));
 float wgt=uGain*smoothstep(0.98,0.55,e)*smoothstep(0.25,0.7,facing)*clamp(1.6-d*0.3,0.2,1.);
 o=vec4(texture(uImg,uv).rgb*wgt,wgt);
}`;
function prog(gl,vs,fs){
  const p=gl.createProgram();
  for(const [t,src] of [[gl.VERTEX_SHADER,vs],[gl.FRAGMENT_SHADER,fs]]){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));gl.attachShader(p,s);}
  gl.bindAttribLocation(p,0,'aP'); gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u={}; const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS); for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i);u[a.name]=gl.getUniformLocation(p,a.name);}
  return {p,u};
}
function canvasTex(gl,canvas,tex){
  tex=tex||gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,canvas);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  return tex;
}
function ringCanvas(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.strokeStyle='#fff';x.lineWidth=10;x.beginPath();x.arc(64,64,54,0,7);x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(64,64,8,0,7);x.fill();return c;}

/* ---------- AR session ---------- */
const A = {}; // live AR state
let glc=null, gl=null, G=null;
function ensureGL(){
  if(gl) return;
  glc=document.createElement('canvas');
  gl=glc.getContext('webgl2',{xrCompatible:true,alpha:true,antialias:true,preserveDrawingBuffer:false});
  if(!gl) throw new Error('WebGL2 not available');
  G={tex:prog(gl,VS_TEX,FS_TEX), acc:prog(gl,VS_ACC,FS_ACC)};
  G.vbo=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,G.vbo); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0,1,0,0,1,1,1]),gl.STATIC_DRAW);
  G.vao=gl.createVertexArray(); gl.bindVertexArray(G.vao); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  G.ring=canvasTex(gl,ringCanvas());
  G.featCanvas=document.createElement('canvas'); G.featTex=gl.createTexture();
}
function flipY(){ try{return localStorage.getItem('wsl-flip')==='1';}catch(e){return false;} }

async function startAR(wall, isNew, tool){
  try{
    ensureGL();
    Object.assign(A,{wall:JSON.parse(JSON.stringify({...wall,mosaic:null})), mosaicBlob:wall.mosaic, isNew, tool, step:'c1', corners:[], F:null,
      nudge:[0,0], opacity:0.6, showMarks:true, showNudge:false, pending:null, recording:false, target:null, hit:null, dirty:false, featDirty:true, hasMosaic:false, frameNo:0, lastHud:0, recFrames:0});
    const root=$('ar');
    const session=await navigator.xr.requestSession('immersive-ar',{
      requiredFeatures:['hit-test','dom-overlay'],
      optionalFeatures:['anchors','camera-access','local-floor','depth-sensing'],
      domOverlay:{root},
      depthSensing:{usagePreference:['cpu-optimized','gpu-optimized'],dataFormatPreference:['luminance-alpha','float32','unsigned-short']}
    });
    A.session=session;
    await gl.makeXRCompatible();
    session.updateRenderState({baseLayer:new XRWebGLLayer(session,gl,{alpha:true,antialias:true})});
    try{A.ref=await session.requestReferenceSpace('local-floor');}catch(e){A.ref=await session.requestReferenceSpace('local');}
    A.viewer=await session.requestReferenceSpace('viewer');
    try{A.hitSource=await session.requestHitTestSource({space:A.viewer,entityTypes:['plane','point']});}
    catch(e){A.hitSource=await session.requestHitTestSource({space:A.viewer});}
    A.binding=null;
    try{ if(session.enabledFeatures?session.enabledFeatures.includes('camera-access'):true) A.binding=new XRWebGLBinding(session,gl);}catch(e){A.binding=null;}
    A.camOK=false;
    root.classList.add('on');
    root.addEventListener('beforexrselect',ev=>ev.preventDefault());
    session.addEventListener('end',onAREnd);
    buildUI();
    session.requestAnimationFrame(onFrame);
  }catch(err){
    console.error(err); $('ar').classList.remove('on');
    alertBox('Couldn’t start the camera', (err.message||String(err))+' Make sure you’re using Chrome on Android with “Google Play Services for AR” installed.');
  }
}
async function onAREnd(){
  $('ar').classList.remove('on');
  const id=A.wall.id;
  if(A.step==='tools' && A.dirty){ await saveWall(true); }
  A.session=null;
  if(await getWall(id)) openWall(id); else renderHome();
}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1700);}
const buzz=()=>{ try{navigator.vibrate&&navigator.vibrate(12);}catch(e){} };

/* camera-screen controls, laid out like the iPhone Camera app */
const MODE_ORDER=['check','pipe','cable','rebar','box','hole','opening','measure'];
const ico = (n,extra='') => `<svg class="i" ${extra}><use href="#i-${n}"/></svg>`;
function sideBtn(el, icon, label, fn, on){
  el.innerHTML=''; el.className='side'+(on?' on':'');
  if(!icon) return;
  const b=document.createElement('button'); b.className='circ glass'; b.innerHTML=icon; b.onclick=fn; b.setAttribute('aria-label',label);
  const l=document.createElement('span'); l.textContent=label;
  el.append(b,l);
}
function buildUI(){
  const step=$('arStep'), msg=$('arMsg'), modes=$('modes'), pills=$('pills'), sh=$('shutter'), L=$('leftCtl'), R=$('rightCtl');
  pills.innerHTML=''; sh.className=''; sh.style.visibility='visible';
  $('nudge').hidden=!(A.step==='tools'&&A.tool==='check'&&A.showNudge);
  modes.hidden=A.step!=='tools';
  if(A.step==='c1'||A.step==='c2'||A.step==='top'){
    const n=A.step==='c1'?1:A.step==='c2'?2:3, total=A.isNew?3:2;
    step.textContent=`Step ${n} of ${total}`;
    msg.textContent = A.step==='c1' ? (A.isNew?'Aim at the bottom-left corner of the wall':'Aim at the same bottom-left corner as before')
      : A.step==='c2' ? 'Now aim at the bottom-right corner' : 'Aim at the top of the wall, where it meets the ceiling';
    sh.querySelector('b').innerHTML = A.step==='top' ? ico('check') : ico('plus');
    sh.onclick = A.step==='top' ? ()=>setTop(null) : ()=>setCorner();
    sh.setAttribute('aria-label', A.step==='top'?'Set top':'Set corner');
    if(A.step==='c2') sideBtn(L, ico('undo'), 'Undo', ()=>{A.corners.pop();A.step='c1';buildUI();}); else sideBtn(L);
    if(A.step==='top') sideBtn(R, '<b style="font-size:13px">2.6</b>', 'Skip', ()=>setTop(DEFAULT_H)); else sideBtn(R);
    return;
  }
  // tools
  if(!modes.children.length || modes.dataset.tool!==A.tool){
    modes.innerHTML=''; modes.dataset.tool=A.tool;
    for(const k of MODE_ORDER){
      const c=document.createElement('button'); c.dataset.k=k;
      c.innerHTML=`${k==='check'?'Check':TYPES[k].label}<i style="background:${k==='check'?'var(--yellow)':TYPES[k].color}"></i>`;
      if(A.tool===k) c.className='sel';
      c.onclick=()=>{ if(A.tool===k) return; if(A.pending&&A.pending.pts.length) finishPending(); A.tool=k; A.pending=null; A.featDirty=true; buzz(); buildUI(); };
      modes.appendChild(c);
    }
    const sel=modes.querySelector('.sel'); if(sel) requestAnimationFrame(()=>sel.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'}));
  }
  const t=TYPES[A.tool];
  if(A.tool==='check'){
    step.textContent='Check';
    msg.textContent='Aim at the spot where you want to drill or hang something';
    sh.style.visibility='hidden';
    sideBtn(L, ico('undo'), 'Undo', undo);
    L.style.visibility='hidden';
    if(!A.isNew) sideBtn(R, ico('adjust'), A.showNudge?'Done':'Align', ()=>{A.showNudge=!A.showNudge;buildUI();}, A.showNudge); else sideBtn(R);
  } else {
    L.style.visibility='visible';
    step.textContent=t.label;
    const np=A.pending?A.pending.pts.length:0;
    msg.textContent = t.kind==='line' ? (np===0?`Aim at one end of the ${t.label.toLowerCase()} and tap +`:`Aim at the next point along it and tap +`)
      : t.kind==='point' ? `Aim at the middle of the ${t.label.toLowerCase()} and tap +`
      : t.kind==='rect' ? (np===0?'Aim at the bottom-left corner of the window or door':'Now aim at its top-right corner')
      : (np===0?'Aim at where to measure from':'Now aim at where to measure to');
    sh.querySelector('b').innerHTML=ico('plus'); sh.onclick=addPoint; sh.setAttribute('aria-label','Add point');
    sideBtn(L, ico('undo'), 'Undo', undo);
    if(A.binding) sideBtn(R, '<span class="recdot"></span>', A.recording?'Stop':'Film', toggleRec, A.recording); else sideBtn(R);
    if(t.kind==='line' && np>=2){
      const p=document.createElement('button'); p.className='pill y'; p.innerHTML=`${ico('check')}Finish ${t.label.toLowerCase()}`;
      p.onclick=()=>{finishPending();buzz();buildUI();}; pills.appendChild(p);
    }
  }
  if(A.hasMosaic && !A.recording){
    const p=document.createElement('div'); p.className='pill glass';
    p.innerHTML=`<span>Photo</span><input type="range" min="0" max="100" value="${Math.round(A.opacity*100)}" aria-label="Photo visibility">`;
    p.querySelector('input').oninput=e=>{A.opacity=e.target.value/100;};
    pills.appendChild(p);
  }
}
async function toggleRec(){
  A.recording=!A.recording; buzz();
  if(A.recording) toast('Move slowly across the whole wall');
  else { toast('Saving picture…'); await saveWall(true); toast('Picture saved'); }
  buildUI();
}
$('arExit').onclick=()=>A.session&&A.session.end();
document.querySelectorAll('#nudge button').forEach(b=>b.onclick=()=>{
  const [x,y]=b.dataset.n.split(',').map(Number); if(!x&&!y) A.nudge=[0,0]; else {A.nudge[0]+=x*0.01;A.nudge[1]+=y*0.01;}
  buzz(); toast(`Moved ${cm(A.nudge[0])} sideways, ${cm(A.nudge[1])} up`);
});
function setCorner(){
  if(!A.hit){toast('No surface found yet. Move the phone slowly.');return;}
  const c={pos:A.hit.pos, mat:A.hit.mat, anchor:null};
  if(A.hit.result && A.hit.result.createAnchor){ A.hit.result.createAnchor().then(a=>c.anchor=a).catch(()=>{}); }
  A.corners.push(c); buzz();
  if(A.step==='c1'){A.step='c2';}
  else {
    const W=Math.hypot(A.corners[1].pos[0]-A.corners[0].pos[0],A.corners[1].pos[2]-A.corners[0].pos[2]);
    if(W<0.2){A.corners.pop();toast('Corners are too close together');return;}
    A.measuredW=W;
    if(A.isNew){A.wall.W=W;A.step='top';}
    else { A.step='tools'; toast(`Corners ${W.toFixed(2)} m apart (saved ${A.wall.W.toFixed(2)} m)`); initMosaic(); }
    computeFrame(true);
  }
  buildUI();
}
function setTop(h){
  if(h===null){ if(!A.target){toast('Aim at the wall');return;} h=A.target[1]; if(h<0.5){toast('That is too low for the top');return;} }
  A.wall.H=h; A.step='tools'; A.dirty=true; buzz(); initMosaic(); buildUI(); saveWall(false); toast('Wall set up. Now film it and add marks.');
}
function computeFrame(initial){
  const a=A.corners[0].pos, b=A.corners[1].pos;
  const U=norm([b[0]-a[0],0,b[2]-a[2]]), V=[0,1,0];
  let N=[-U[2],0,U[0]];
  if(initial){ A.nSign = (A.camPos && dot(N,sub(A.camPos,a))<0) ? -1 : 1; }
  N=scl(N,A.nSign||1);
  A.F={A:a,U,V,N};
}
function origin(){ return add(add(A.F.A, scl(A.F.U,A.nudge[0])), scl(A.F.V,A.nudge[1])); }

function addPoint(){
  if(!A.target){toast('Aim at the wall');return;}
  const p=[+A.target[0].toFixed(3), +A.target[1].toFixed(3)];
  const t=TYPES[A.tool];
  buzz();
  if(t.kind==='point'){ A.wall.features.push({id:uid(),type:A.tool,pts:[p]}); toast(t.label+' added'); saveWall(false); }
  else {
    if(!A.pending) A.pending={type:A.tool,pts:[]};
    A.pending.pts.push(p);
    if((t.kind==='rect'||t.kind==='two') && A.pending.pts.length===2) finishPending();
  }
  A.dirty=true; A.featDirty=true; buildUI();
}
function finishPending(){
  if(A.pending && A.pending.pts.length>=2){ A.wall.features.push({id:uid(),type:A.pending.type,pts:A.pending.pts}); A.dirty=true; toast(TYPES[A.pending.type].label+' saved'); A.pending=null; saveWall(false); }
  A.pending=null; A.featDirty=true;
}
function undo(){
  if(A.pending&&A.pending.pts.length){A.pending.pts.pop();}
  else if(A.wall.features.length){A.wall.features.pop();toast('Removed last mark');}
  A.dirty=true; A.featDirty=true; buildUI(); saveWall(false);
}

/* mosaic: the wall picture built from the live camera, stored premultiplied in a texture */
function initMosaic(){
  const W=A.wall.W, H=A.wall.H, ppm=Math.min(400, 2048/Math.max(W,H));
  A.tw=Math.max(16,Math.round(W*ppm)); A.th=Math.max(16,Math.round(H*ppm));
  if(G.mosTex){gl.deleteTexture(G.mosTex);gl.deleteFramebuffer(G.mosFB);}
  G.mosTex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,G.mosTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,A.tw,A.th,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  for(const [k,v] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D,k,v);
  G.mosFB=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,G.mosFB);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,G.mosTex,0);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  A.hasMosaic=false;
  if(A.mosaicBlob){
    const img=new Image();
    img.onload=()=>{
      gl.bindTexture(gl.TEXTURE_2D,G.mosTex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);
      gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,Math.min(A.tw,img.width),Math.min(A.th,img.height),gl.RGBA,gl.UNSIGNED_BYTE,resizeTo(img,A.tw,A.th));
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
      A.hasMosaic=true; A.opacity=A.tool==='check'?0.7:0.45; buildUI();
    };
    img.src=URL.createObjectURL(A.mosaicBlob);
  }
}
function resizeTo(img,w,h){ if(img.width===w&&img.height===h) return img; const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);return c; }

async function saveWall(full){
  const w=A.wall; w.updated=Date.now();
  if(G.mosFB && (A.recFrames>0 || A.mosaicBlob)){
    if(A.recFrames>0 && full){
      gl.bindFramebuffer(gl.FRAMEBUFFER,G.mosFB);
      const px=new Uint8Array(A.tw*A.th*4); gl.readPixels(0,0,A.tw,A.th,gl.RGBA,gl.UNSIGNED_BYTE,px);
      gl.bindFramebuffer(gl.FRAMEBUFFER,null);
      const c=document.createElement('canvas'); c.width=A.tw; c.height=A.th; const ctx=c.getContext('2d');
      const id=ctx.createImageData(A.tw,A.th); let cov=0;
      for(let y=0;y<A.th;y++){ const src=(A.th-1-y)*A.tw*4, dst=y*A.tw*4;
        for(let x=0;x<A.tw*4;x+=4){ const a=px[src+x+3]; if(a>128) cov++;
          if(a>6){ id.data[dst+x]=Math.min(255,px[src+x]*255/a); id.data[dst+x+1]=Math.min(255,px[src+x+1]*255/a); id.data[dst+x+2]=Math.min(255,px[src+x+2]*255/a); id.data[dst+x+3]=a; } } }
      ctx.putImageData(id,0,0);
      w.mosaic=await new Promise(r=>c.toBlob(r,'image/png'));
      w.coverage=cov/(A.tw*A.th); A.mosaicBlob=w.mosaic; A.recFrames=0;
    } else w.mosaic=A.mosaicBlob;
  } else w.mosaic=A.mosaicBlob||null;
  await putWall(w); if(full) A.dirty=false;
}

function redrawFeatures(){
  const W=A.wall.W,H=A.wall.H, s=Math.min(250, 2048/Math.max(W,H));
  const c=G.featCanvas; c.width=Math.round(W*s); c.height=Math.round(H*s);
  const ctx=c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height);
  ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=4; ctx.strokeRect(2,2,c.width-4,c.height-4);
  if(A.showMarks) drawWall(ctx,A.wall,s,{pending:A.pending});
  canvasTex(gl,c,G.featTex); A.featDirty=false;
}

function onFrame(t,frame){
  const session=frame.session; session.requestAnimationFrame(onFrame);
  const pose=frame.getViewerPose(A.ref); if(!pose) return;
  A.frameNo++;
  const vm=pose.transform.matrix; A.camPos=mpos(vm);
  // follow anchors so the wall stays put if tracking corrects itself
  for(const c of A.corners){ if(c.anchor && frame.trackedAnchors && frame.trackedAnchors.has(c.anchor)){ const p=frame.getPose(c.anchor.anchorSpace,A.ref); if(p) c.pos=mpos(p.transform.matrix); } }
  if(A.corners.length===2) computeFrame(false);
  // what the cross is pointing at
  A.hit=null;
  const hr=frame.getHitTestResults(A.hitSource);
  if(hr.length){ const p=hr[0].getPose(A.ref); if(p) A.hit={result:hr[0],pos:mpos(p.transform.matrix),mat:p.transform.matrix}; }
  A.target=null;
  if(A.F){
    const o=A.camPos, dir=norm([-vm[8],-vm[9],-vm[10]]), O=origin();
    const den=dot(dir,A.F.N);
    if(Math.abs(den)>1e-3){ const tt=dot(sub(O,o),A.F.N)/den; if(tt>0.05&&tt<12){ const P=add(o,scl(dir,tt)); A.targetPos=P; A.target=[dot(sub(P,O),A.F.U), dot(sub(P,O),A.F.V)]; } }
  }
  const layer=session.renderState.baseLayer;
  // grow the wall picture from the live camera image
  if(A.recording && A.step==='tools' && A.binding && G.mosFB && (A.frameNo%2===0)){
    for(const view of pose.views){ if(view.camera){ A.camOK=true;
      const img=A.binding.getCameraImage(view.camera); if(img) accumulate(view,img); break; } }
  }
  if(A.featDirty && A.step==='tools') redrawFeatures();
  gl.bindFramebuffer(gl.FRAMEBUFFER,layer.framebuffer);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(G.tex.p); gl.bindVertexArray(G.vao); gl.activeTexture(gl.TEXTURE0); gl.uniform1i(G.tex.u.uT,0);
  const level = hudInfo();
  const tint = level==='bad'?[1,.3,.3,1]:level==='warn'?[1,.75,.2,1]:level==='ok'?[.3,1,.5,1]:[1,1,1,1];
  for(const view of pose.views){
    const vp=layer.getViewport(view); gl.viewport(vp.x,vp.y,vp.width,vp.height);
    gl.uniformMatrix4fv(G.tex.u.uVP,false,mul(view.projectionMatrix,view.transform.inverse.matrix));
    if(A.F && A.step==='tools'){
      const O=add(origin(),scl(A.F.N,0.003)), M=basis(scl(A.F.U,A.wall.W),scl(A.F.V,A.wall.H),A.F.N,O);
      gl.uniformMatrix4fv(G.tex.u.uM,false,M);
      const op=A.opacity;
      if(A.hasMosaic && op>0 && !A.recording){ gl.bindTexture(gl.TEXTURE_2D,G.mosTex); gl.uniform1i(G.tex.u.uPre,1); gl.uniform1f(G.tex.u.uO,op); gl.drawArrays(gl.TRIANGLE_STRIP,0,4); }
      gl.bindTexture(gl.TEXTURE_2D,G.featTex); gl.uniform1i(G.tex.u.uPre,0); gl.uniform1f(G.tex.u.uO,1); gl.uniform4f(G.tex.u.uTint,1,1,1,1); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    }
    // corner markers
    gl.bindTexture(gl.TEXTURE_2D,G.ring); gl.uniform1i(G.tex.u.uPre,0); gl.uniform1f(G.tex.u.uO,1);
    gl.uniform4f(G.tex.u.uTint,0.3,0.8,1,1);
    for(const c of A.corners){ drawRingAt(c.pos,c.mat,0.06); }
    // reticle
    gl.uniform4f(G.tex.u.uTint,...tint);
    if(A.F && A.targetPos){ const s=0.05; const P=add(add(A.targetPos,scl(A.F.N,0.004)),add(scl(A.F.U,-s/2),scl(A.F.V,-s/2))); gl.uniformMatrix4fv(G.tex.u.uM,false,basis(scl(A.F.U,s),scl(A.F.V,s),A.F.N,P)); gl.drawArrays(gl.TRIANGLE_STRIP,0,4); }
    else if(A.hit && A.step!=='tools'){ drawRingAt(A.hit.pos,A.hit.mat,0.08); }
  }
}
function drawRingAt(pos,m,s){
  const X=[m[0],m[1],m[2]], Z=[m[8],m[9],m[10]], Y=[m[4],m[5],m[6]];
  const P=add(add(pos,scl(Y,0.002)),add(scl(X,-s/2),scl(Z,-s/2)));
  gl.uniformMatrix4fv(G.tex.u.uM,false,basis(scl(X,s),scl(Z,s),Y,P)); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
function accumulate(view,img){
  gl.bindFramebuffer(gl.FRAMEBUFFER,G.mosFB); gl.viewport(0,0,A.tw,A.th);
  gl.enable(gl.BLEND); gl.blendFuncSeparate(gl.ONE,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  const P=G.acc; gl.useProgram(P.p); gl.bindVertexArray(G.vao);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,img); gl.uniform1i(P.u.uImg,0);
  gl.uniformMatrix4fv(P.u.uCamVP,false,mul(view.projectionMatrix,view.transform.inverse.matrix));
  const O=origin();
  gl.uniform3fv(P.u.uA,O); gl.uniform3fv(P.u.uU,A.F.U); gl.uniform3fv(P.u.uV,A.F.V); gl.uniform3fv(P.u.uN,A.F.N); gl.uniform3fv(P.u.uCam,mpos(view.transform.matrix));
  gl.uniform1f(P.u.uW,A.wall.W); gl.uniform1f(P.u.uH,A.wall.H); gl.uniform1f(P.u.uGain,0.12); gl.uniform1f(P.u.uFlip,flipY()?1:0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  gl.bindTexture(gl.TEXTURE_2D,null);
  A.hasMosaic=true; A.recFrames++; A.dirty=true;
}
function hudInfo(){
  const now=performance.now(), r=$('readout'), ret=$('reticle');
  let level=null;
  if(A.step!=='tools'){
    if(now-A.lastHud>150){ A.lastHud=now;
      const ok = A.step==='top' ? !!A.target : !!A.hit;
      r.textContent = ok ? '' : (A.step==='top'?'Point at the wall':'Move your phone slowly to find the surface');
      ret.style.setProperty('--rc', ok?'#fff':'rgba(255,255,255,.4)'); $('shutter').disabled=!ok; }
    return null;
  }
  if(!A.target){ if(now-A.lastHud>150){A.lastHud=now;r.textContent='Point at the wall';ret.style.setProperty('--rc','rgba(255,255,255,.4)');} return null; }
  const p=A.target, inside=p[0]>=-0.02&&p[0]<=A.wall.W+0.02&&p[1]>=-0.02&&p[1]<=A.wall.H+0.02;
  let d=null;
  if(A.tool==='check'){ d=describe(A.wall,p); level=d.level; }
  if(now-A.lastHud>120){
    A.lastHud=now;
    const col = level==='bad'?'#ff453a':level==='warn'?'#ffd60a':level==='ok'?'#30d158':'#fff';
    ret.style.setProperty('--rc', inside?col:'rgba(255,255,255,.4)');
    if(!inside) r.innerHTML='Outside this wall';
    else if(A.tool==='check') r.innerHTML=`<span style="color:${col}">${d.status}</span><br><small>${d.free}</small>`;
    else {
      let extra='';
      if(A.pending&&A.pending.pts.length){ const q=A.pending.pts[A.pending.pts.length-1]; extra=` · <small>${mm2(Math.hypot(p[0]-q[0],p[1]-q[1]))} from last</small>`; }
      r.innerHTML=`${mm2(Math.max(0,p[0]))} from left · ${mm2(Math.max(0,p[1]))} up${extra}`+(A.recording?`<br><small style="color:#ff6961">● Filming · move slowly</small>`:'');
    }
  }
  return level;
}

/* ---------- start ---------- */
if(new URLSearchParams(location.search).has('flip')){ try{localStorage.setItem('wsl-flip',new URLSearchParams(location.search).get('flip'));}catch(e){} }
checkSupport().then(renderHome).catch(e=>{console.error(e);renderHome();}).then(()=>{ let seen=false; try{seen=localStorage.getItem('wsl-onboarded')==='1';}catch(e){} if(!seen) showOnboarding(); });
</script>
</body>
